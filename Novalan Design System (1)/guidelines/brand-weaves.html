<!-- @dsCard group="Brand" viewport="700x170" name="Weave textures" subtitle="Gradient-built cloth: plain, twill, herringbone, canvas" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.tok{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div class="nv-weave-plain" style="height:96px;background-color:var(--nv-khaki-300);outline:1px solid var(--border-hairline)"></div><div class="tok" style="margin-top:6px">--weave-plain</div></div>
<div><div class="nv-weave-twill" style="height:96px;background-color:var(--nv-khaki-500);outline:1px solid var(--border-hairline)"></div><div class="tok" style="margin-top:6px">--weave-twill</div></div>
<div><div class="nv-weave-herringbone" style="height:96px;background-color:var(--nv-walnut-300);outline:1px solid var(--border-hairline)"></div><div class="tok" style="margin-top:6px">--weave-herringbone</div></div>
<div><div class="nv-weave-canvas" style="height:96px;outline:1px solid var(--border-hairline)"></div><div class="tok" style="margin-top:6px">--weave-canvas</div></div>
</div></body></html>
