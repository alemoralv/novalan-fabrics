<!-- @dsCard group="Brand" viewport="700x180" name="Depth and veils" subtitle="Hover lift, overlay shadow, ink scrim + blur" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.tok{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start">
<div><div style="height:88px;background:var(--surface-card);border:1px solid var(--border-hairline);box-shadow:var(--shadow-sheet)"></div><div class="tok" style="margin-top:6px">--shadow-sheet · rest</div></div>
<div><div style="height:88px;background:var(--surface-card);border:1px solid var(--border-hairline-strong);box-shadow:var(--shadow-hover)"></div><div class="tok" style="margin-top:6px">--shadow-hover · hover only</div></div>
<div><div style="height:88px;background:var(--nv-khaki-500);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background:var(--scrim-ink);backdrop-filter:var(--blur-veil)"></div><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--nv-paper-300);font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase">Scrim + blur</div></div><div class="tok" style="margin-top:6px">--scrim-ink · modales</div></div>
</div></body></html>
