<!-- @dsCard group="Colors" viewport="700x170" name="Semantic pigments" subtitle="Dye-bath olive, ochre and brick — status only" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}
.sw{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:2px}
.sw div{height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--type-label);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.hex{font-family:var(--font-mono);font-size:9px;opacity:.75;display:block;letter-spacing:0}
.lbl{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
</style></head><body>
<div class="sw" style="--n:3">
<div style="background:var(--nv-olive-500);color:#F6F3EC">Olive · exito<span class="hex">#5B6E4F</span></div>
<div style="background:var(--nv-ochre-500);color:#0B0B0B">Ochre · aviso<span class="hex">#B07A2E</span></div>
<div style="background:var(--nv-brick-500);color:#F6F3EC">Brick · error<span class="hex">#8E3B2E</span></div>
</div>
<div class="sw" style="--n:3;margin-top:2px">
<div style="background:var(--nv-olive-100);color:var(--nv-olive-500);height:44px">bg exito<span class="hex">#E2E6DA</span></div>
<div style="background:var(--nv-ochre-100);color:var(--nv-ochre-500);height:44px">bg aviso<span class="hex">#F1E4CD</span></div>
<div style="background:var(--nv-brick-100);color:var(--nv-brick-500);height:44px">bg error<span class="hex">#F0DFDA</span></div>
</div></body></html>
