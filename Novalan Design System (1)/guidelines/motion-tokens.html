<!-- @dsCard group="Motion" viewport="700x170" name="Durations and easing" subtitle="90 / 160 / 240 / 420 / 640 ms — no bounce, ever" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.tok{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head><body>
<style>
.tr{position:relative;height:22px;background:var(--surface-sunken);overflow:hidden}
.tr i{position:absolute;left:0;top:0;bottom:0;width:26px;background:var(--nv-ink-900);animation:slide 3.2s var(--ease-out-soft) infinite alternate}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(calc(100% * 12))}}
</style>
<div style="display:grid;gap:10px">
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><span class="tok">--dur-fast 160</span><div class="tr"><i style="animation-duration:1.2s"></i></div></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><span class="tok">--dur 240</span><div class="tr"><i style="animation-duration:1.8s"></i></div></div>
<div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center"><span class="tok">--dur-curtain 640</span><div class="tr"><i style="animation-duration:3.4s"></i></div></div>
<div class="tok">--ease-standard cubic-bezier(.22,.61,.36,1) · --ease-out-soft cubic-bezier(.16,1,.3,1)</div>
</div></body></html>
