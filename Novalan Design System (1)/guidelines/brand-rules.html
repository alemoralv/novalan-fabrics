<!-- @dsCard group="Brand" viewport="700x180" name="Hairlines and geometry" subtitle="1 px rules, square corners, zero radius" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.tok{font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}</style></head><body>
<div style="display:grid;gap:14px">
<div style="display:flex;align-items:center;gap:16px"><span class="nv-label">Hairline .14</span><span style="flex:1;height:1px;background:var(--border-hairline)"></span></div>
<div style="display:flex;align-items:center;gap:16px"><span class="nv-label">Strong .28</span><span style="flex:1;height:1px;background:var(--border-hairline-strong)"></span></div>
<div style="display:flex;align-items:center;gap:16px"><span class="nv-label">Solid ink</span><span style="flex:1;height:1px;background:var(--border-solid)"></span></div>
<div style="display:flex;align-items:center;gap:16px"><span class="nv-label">Accent khaki</span><span style="flex:1;height:1px;background:var(--border-accent)"></span></div>
<div style="display:flex;gap:12px;margin-top:4px">
<div style="width:88px;height:44px;border:1px solid var(--border-hairline);background:var(--surface-card)"></div>
<div style="width:88px;height:44px;border:1px solid var(--border-solid)"></div>
<div style="width:88px;height:44px;background:var(--nv-ink-900)"></div>
<span class="tok" style="align-self:center">--radius-none · the only curve in the system is a 5 px status dot</span>
</div>
</div></body></html>
