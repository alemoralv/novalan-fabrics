<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Novalan — Tienda</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script>window.NV_ASSETS="../../assets/";</script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shop.jsx"></script>
<script type="text/babel">
function App(){
  const {Toast}=window.NovalanDesignSystem_054783;
  const [items,setItems]=React.useState([]);
  const [cart,setCart]=React.useState(false);
  const [view,setView]=React.useState("pdp");
  const [toast,setToast]=React.useState(null);
  const add=it=>{setItems(v=>[...v,it]);setToast("Agregamos "+it.name+" a tu bolsa.");setTimeout(()=>setToast(null),4000);};
  return <div>
    <window.ShopHeader count={items.length} openCart={()=>setCart(true)}/>
    {view==="pdp"&&<window.ProductPage add={add}/>}
    {view==="checkout"&&<window.Checkout items={items} back={()=>setView("pdp")} done={()=>{setView("done")}}/>}
    {view==="done"&&<window.Confirmed folio="NV-26-0418" back={()=>{setItems([]);setView("pdp")}}/>}
    {cart&&<window.CartDrawer items={items} close={()=>setCart(false)} remove={i=>setItems(v=>v.filter((_,x)=>x!==i))}
      checkout={()=>{setCart(false);setView("checkout")}}/>}
    {toast&&<div style={{position:"fixed",left:24,bottom:24,zIndex:60}}><Toast action="Ver bolsa" onClose={()=>setToast(null)}>{toast}</Toast></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
