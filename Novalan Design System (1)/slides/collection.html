<!-- @dsCard group="Slides" viewport="1280x720" name="Colección" subtitle="Swatch strip with codes over an ink band" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page);display:flex}
.pad{padding:72px 88px}
.lbl{font:var(--type-label);font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
h1,h2{letter-spacing:var(--ls-display)}
</style></head><body><div class="slide" style="flex-direction:column">
<div style="flex:1;display:grid;grid-template-columns:repeat(6,1fr)">
<div style="background:var(--nv-ink-900);background-image:var(--weave-plain)"></div>
<div style="background:var(--nv-walnut-700);background-image:var(--weave-twill)"></div>
<div style="background:var(--nv-walnut-500);background-image:var(--weave-herringbone)"></div>
<div style="background:var(--nv-khaki-500);background-image:var(--weave-twill)"></div>
<div style="background:var(--nv-khaki-300);background-image:var(--weave-plain)"></div>
<div style="background:var(--nv-khaki-100);background-image:var(--weave-plain)"></div>
</div>
<div style="background:var(--surface-page);padding:44px 88px 52px;display:grid;gap:24px">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:0">
<div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Negro</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-0B0B</span></div><div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Nogal</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-4A37</span></div><div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Barro</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-6B53</span></div><div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Khaki</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-A89B</span></div><div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Arena</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-C4B9</span></div><div style="display:grid;gap:4px"><span style="font-family:var(--font-display);font-size:24px">Crudo</span><span class="mono" style="font-size:13px;color:var(--text-muted)">NV-D8CF</span></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-hairline);padding-top:20px">
<span class="lbl">Coloridos de temporada · teñido en pieza</span>
<img src="../assets/novalan-lockup-wordmark.png" alt="Novalan" style="width:120px;opacity:.75">
</div>
</div></div></body></html>
