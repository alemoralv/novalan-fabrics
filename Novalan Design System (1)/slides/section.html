<!-- @dsCard group="Slides" viewport="1280x720" name="Divisor de sección" subtitle="Khaki ground, texture kept off the type, number + section title" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--nv-khaki-500);display:flex}
.band{width:132px;flex:0 0 132px;background-image:var(--weave-canvas);border-right:1px solid rgba(11,11,11,.28)}
.pad{padding:72px 88px}
.lbl{font:var(--type-label);font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;color:rgba(11,11,11,.62)}
.mono{font-family:var(--font-mono)}
h2{letter-spacing:var(--ls-display)}
</style></head><body>
<div class="slide">
<div class="band"></div>
<div class="pad" style="display:flex;flex-direction:column;justify-content:center;gap:30px;width:100%">
<span class="mono" style="font-size:15px;color:rgba(11,11,11,.66)">02 / 06</span>
<div style="height:1px;background:rgba(11,11,11,.45);width:200px"></div>
<h2 style="font-family:var(--font-display);font-weight:500;font-size:88px;line-height:1;margin:0;max-width:18ch;color:var(--nv-ink-950)">El taller y sus telares</h2>
<span style="font-family:var(--font-display);font-style:italic;font-weight:500;font-size:30px;color:var(--nv-walnut-900)">Seis telares de lanzadera, cuarenta y tres años</span>
</div>
</div></body></html>
