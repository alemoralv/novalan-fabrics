<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page);display:flex}
.pad{padding:72px 88px}

.mono{font-family:var(--font-mono)}

</style></head><body><div class="slide">
<div class="pad" style="display:flex;flex-direction:column;justify-content:center;gap:40px;width:100%">
<div style="height:1px;background:var(--border-solid)"></div>
<h2 style="font-family:var(--font-display);font-weight:400;font-size:76px;line-height:1.05;margin:0;max-width:26ch">Cada rollo lleva su número de lote y la firma de quien lo revisó.</h2>
<div style="display:flex;justify-content:space-between;align-items:center">
<span class="lbl">Trazabilidad</span>

</div>
</div></div></body></html>
