<!-- @dsCard group="Slides" viewport="1280x720" name="Cifras" subtitle="Four display-serif figures over micro-labels" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page);display:flex}
.pad{padding:72px 88px}
.lbl{font:var(--type-label);font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
h1,h2{letter-spacing:var(--ls-display)}
</style></head><body><div class="slide">
<div class="pad" style="display:grid;grid-template-rows:auto 1fr auto;gap:40px;width:100%;box-sizing:border-box">
<div style="display:grid;gap:14px"><span class="lbl">Cierre 2025</span>
<h2 style="font-family:var(--font-display);font-weight:400;font-size:56px;margin:0">El año en números</h2></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-content:start">
<div style="background:var(--surface-card);border:1px solid var(--border-hairline);padding:34px 28px;display:grid;gap:12px;height:200px;box-sizing:border-box;align-content:start">
<span style="font-family:var(--font-display);font-weight:400;font-size:64px;line-height:1">48,200</span><span class="lbl">metros tejidos</span></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);padding:34px 28px;display:grid;gap:12px;height:200px;box-sizing:border-box;align-content:start">
<span style="font-family:var(--font-display);font-weight:400;font-size:64px;line-height:1">18</span><span class="lbl">tejidos en catálogo</span></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);padding:34px 28px;display:grid;gap:12px;height:200px;box-sizing:border-box;align-content:start">
<span style="font-family:var(--font-display);font-weight:400;font-size:64px;line-height:1">214</span><span class="lbl">clientes de mayoreo</span></div><div style="background:var(--surface-card);border:1px solid var(--border-hairline);padding:34px 28px;display:grid;gap:12px;height:200px;box-sizing:border-box;align-content:start">
<span style="font-family:var(--font-display);font-weight:400;font-size:64px;line-height:1">1.4%</span><span class="lbl">merma en revisión</span></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">Fuente: control de piso, Puebla</span><span class="mono" style="font-size:14px;color:var(--text-muted)">05</span></div>
</div></div></body></html>
