<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page);display:flex}
.pad{padding:72px 88px}
.lbl{font:var(--type-label);font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
h1,h2{letter-spacing:var(--ls-display)}
</style></head><body><div class="slide" style="background:var(--nv-ink-900);background-image:var(--weave-twill);flex-direction:column;justify-content:space-between">
<div class="pad" style="display:flex;flex-direction:column;justify-content:space-between;height:100%;width:100%;box-sizing:border-box">
<img src="../assets/novalan-lockup-wordmark-light.png" alt="Novalan" style="width:260px">
<div style="display:grid;gap:26px">
<span class="lbl" style="color:var(--nv-khaki-300)">Presentación de colección · Otoño 2026</span>
<h1 style="font-family:var(--font-display);font-weight:400;font-size:104px;line-height:.98;color:var(--nv-paper-300);margin:0;max-width:20ch">Tejido para durar generaciones</h1>
</div>
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<span class="lbl" style="color:rgba(246,243,236,.55)">Puebla, México</span>
<span class="mono" style="font-size:15px;color:rgba(246,243,236,.55)">01</span>
</div>
</div></div></body></html>
