<!-- @dsCard group="Slides" viewport="1280x720" name="Comparación" subtitle="Two columns split by a vertical hairline" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}
.slide{width:1280px;height:720px;overflow:hidden;position:relative;background:var(--surface-page);display:flex}
.pad{padding:72px 88px}
.lbl{font:var(--type-label);font-size:13px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
h1,h2{letter-spacing:var(--ls-display)}
</style></head><body><div class="slide">
<div class="pad" style="display:grid;grid-template-rows:auto 1fr;gap:44px;width:100%;box-sizing:border-box">
<div style="display:grid;gap:14px">
<span class="lbl">Modelo de negocio</span>
<h2 style="font-family:var(--font-display);font-weight:400;font-size:56px;margin:0">Menudeo y mayoreo</h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1px 1fr;gap:56px">
<div style="display:grid;gap:22px;align-content:start">
<span class="lbl" style="color:var(--text-accent)">Menudeo · novalan.mx</span>
<div style="display:grid;gap:14px">
<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Ticket promedio</span><span class="mono" style="font-size:17px">$2,860 MXN</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Piezas por temporada</span><span class="mono" style="font-size:17px">42</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Entrega</span><span class="mono" style="font-size:17px">3–5 días</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Margen</span><span class="mono" style="font-size:17px">62%</span></div>
</div></div>
<div style="background:var(--border-hairline-strong)"></div>
<div style="display:grid;gap:22px;align-content:start">
<span class="lbl" style="color:var(--text-accent)">Mayoreo · portal</span>
<div style="display:grid;gap:14px">
<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Pedido mínimo</span><span class="mono" style="font-size:17px">30 m</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Tejidos en catálogo</span><span class="mono" style="font-size:17px">18</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Plazo</span><span class="mono" style="font-size:17px">4 semanas</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border-hairline)"><span class="lbl">Margen</span><span class="mono" style="font-size:17px">38%</span></div>
</div></div>
</div></div></div></body></html>
