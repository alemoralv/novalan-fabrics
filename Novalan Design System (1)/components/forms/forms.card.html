<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);padding:22px 26px}.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.stack{display:grid;gap:18px}.cap{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div><script type="text/babel">
const NV=window.NovalanDesignSystem_054783;
const {Input,Select,Checkbox,Radio,Switch}=NV;
function Demo(){const [c,setC]=React.useState(true),[r,setR]=React.useState("std"),[s,setS]=React.useState(true),[m,setM]=React.useState("24"),[rfc,setRfc]=React.useState("NOVA83");
return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"26px 32px"}}>
<Input label="Correo" placeholder="nombre@empresa.mx"/>
<Select label="Colorido" options={["Crudo","Khaki","Nogal","Negro"]}/>
<Input label="Metros" value={m} onChange={e=>setM(e.target.value)} suffix={<span className="cap">m</span>}/>
<Input label="RFC" value={rfc} onChange={e=>setRfc(e.target.value)} error="Formato inválido"/>
<div className="stack" style={{gap:10}}><Checkbox label="Algodón orgánico" checked={c} onChange={setC}/><Checkbox label="Certificado GOTS" description="Solo lotes vigentes" checked={false} onChange={()=>{}}/><Checkbox label="Descontinuado" disabled/></div>
<div className="stack" style={{gap:10}}><Radio label="Envío estándar" description="5–7 días hábiles" checked={r==="std"} onChange={()=>setR("std")}/><Radio label="Envío exprés" checked={r==="exp"} onChange={()=>setR("exp")}/><Switch label="Solo disponibles" checked={s} onChange={setS}/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
